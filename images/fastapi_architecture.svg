  <text x="120" y="80" font-size="16" text-anchor="middle" fill="#1F618D">Frontend</text>
  <text x="120" y="105" font-size="12" text-anchor="middle" fill="#1F618D">Browser / App</text>
  <line x1="220" y1="90" x2="320" y2="90" stroke="#1F618D" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="320" y="28" width="220" height="164" fill="#FCF3CF" stroke="#B7950B" stroke-width="2" rx="10"/>
  <text x="430" y="60" font-size="16" text-anchor="middle" fill="#7D6608">FastAPI App</text>
